<!doctype html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <h1>Login</h1>

        {% if message %}
            <p><strong>{{message}}</strong></p>
        {% endif %}

        <form method="post">
            Username : <input type="text" name="username"><br>
            Password : <input type="password" name="password"><br>
            <button type="submit">Log in</button>
        </form>

        <p><a href="/register">Create an account</a> | <a href="/">Back to the game</a></p>
    </body>
</html>
