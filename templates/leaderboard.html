<!DOCTYPE html>
<html>
    <head>
        <title>Leaderboard</title>
    </head>
    <body>
        <h1>Leaderboard</h1>

        <table border="1" cellpadding="6">
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
                <th>Rounds</th>
            </tr>

            {% for row in rows %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
            </tr>
            {% endfor %}
        </table>

        <p><a href="/">Back to the game</a></p>
        
    </body>
</html>
