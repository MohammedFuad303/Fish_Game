<!doctype html>
<html>
<head>
    <title>Fish Game</title>
</head>
<body>
    <h1>Fish Game</h1>
    <p>Count the fish and the chests:</p>
    <img src="{{ image_url }}" width="500">

    {% if message %}
        <p><strong>{{ message }}</strong></p>
    {% endif %}

    <form method="post" action="/guess">
        Fish: <input type="number" name="fish">
        Chests: <input type="number" name="chest">
        <button type="submit">Submit</button>
    </form>

    <p>Score: {{ score }}</p>
    <p>Rounds: {{ rounds }}</p>
    <p>Visits: {{ visits }}</p>
</body>
</html>
